{% extends "bootstrap_5_layout.html" %}
{% set active_page = "hello" %}

{% block title %}Hello | Camille's Web App{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">{{ message }}</h1>
                <p class="text-body-secondary">This is a paragraph on the "hello" page {{ x }}.</p>

                <form action="/hello" method="GET">
                    <label for="name" class="form-label fw-semibold">Your Name</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="name" name="name" placeholder="Harper">
                        <button type="submit" class="btn btn-primary">Greet Me</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
