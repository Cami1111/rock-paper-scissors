{% extends "bootstrap_5_layout.html" %}
{% set active_page = "rps_form" %}

{% block title %}Rock Paper Scissors | Cami's Web App{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-3"><i class="bi bi-controller me-2 text-primary"></i>Rock Paper Scissors Game</h1>
                <p class="text-body-secondary mb-4">Pick your move and test your luck against the computer.</p>

                <form action="/rps/results" method="POST">
                    <div class="mb-4">
                        <label for="user_choice" class="form-label fw-semibold">Choose your move:</label>
                        <select id="user_choice" name="user_choice" class="form-select form-select-lg">
                            <option value="rock">Rock</option>
                            <option value="paper">Paper</option>
                            <option value="scissors">Scissors</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-play-fill me-1"></i>Play
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
